<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CanvasEngine Samples</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #070b14;
        color: #e8edf7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        display: flex;
        background: #070b14;
      }

      .sidebar {
        width: 264px;
        min-width: 264px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #202a3c;
        background: linear-gradient(180deg, #111827 0%, #0a0f1c 100%);
      }

      .brand {
        padding: 22px 22px 18px;
        border-bottom: 1px solid #202a3c;
      }

      .brand-kicker {
        margin: 0 0 5px;
        color: #6ee7f9;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      .brand-title {
        margin: 0;
        font-size: 21px;
        letter-spacing: -.02em;
      }

      .sample-list {
        min-height: 0;
        padding: 12px;
        overflow-y: auto;
        scrollbar-color: #334155 transparent;
      }

      .sample-link {
        display: block;
        margin: 2px 0;
        padding: 9px 11px;
        border: 1px solid transparent;
        border-radius: 8px;
        color: #9baac0;
        font-size: 13px;
        line-height: 1.25;
        text-decoration: none;
        transition: 140ms ease;
      }

      .sample-link:hover {
        border-color: #2d3c55;
        background: #172033;
        color: #f8fafc;
      }

      .sample-link.is-active {
        border-color: #256f80;
        background: linear-gradient(90deg, #12394a, #162238);
        color: #ecfeff;
        box-shadow: inset 3px 0 #67e8f9;
      }

      .sample-shell {
        min-width: 0;
        height: 100vh;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .sample-header {
        height: 64px;
        min-height: 64px;
        display: flex;
        align-items: center;
        padding: 0 24px;
        border-bottom: 1px solid #1d2738;
        background: #0d1320;
      }

      .sample-title {
        margin: 0;
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -.01em;
      }

      #root {
        min-width: 0;
        min-height: 0;
        width: 100%;
        flex: 1;
        overflow: hidden;
      }

      #root canvas {
        display: block;
      }

      @media (max-width: 720px) {
        .sidebar {
          width: 188px;
          min-width: 188px;
        }

        .brand {
          padding-inline: 16px;
        }

        .brand-title {
          font-size: 18px;
        }

        .sample-header {
          padding-inline: 16px;
        }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <header class="brand">
        <p class="brand-kicker">CanvasEngine</p>
        <h1 class="brand-title">Samples</h1>
      </header>
      <nav class="sample-list" data-sample-list aria-label="CanvasEngine samples"></nav>
    </aside>
    <main class="sample-shell">
      <header class="sample-header">
        <h2 class="sample-title" data-sample-title>Loading sample…</h2>
      </header>
      <div id="root"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
